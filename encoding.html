<!DOCTYPE html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>โปรแกรมจำลองการ Encoding / Decoding (Base64)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* CSS Variables for mouse position */
      html {
        --mouse-x: 50%;
        --mouse-y: 50%;
      }

      /* Custom font */
      body {
        font-family: "Anuphan", sans-serif;
        background-color: #0b0c10; /* Dark blue from the image */

        /* Cursor Spotlight Effect */
        background-image: radial-gradient(
          600px circle at var(--mouse-x) var(--mouse-y),
          rgba(102, 252, 241, 0.1),
          /* Bright blue-green color from theme, 10% opacity */ transparent 60%
            /* Fade out to transparent */
        );
        background-repeat: no-repeat;
        background-attachment: fixed; /* Gradient stays fixed to viewport */

        color: #c5c6c7; /* Light gray text */
        overflow: hidden; /* Prevent scrollbars */
        position: relative;
      }

      /* Style for the textareas */
      textarea {
        font-family: "Courier New", Courier, monospace;
        word-break: break-all;
        min-height: 150px; /* ให้พื้นที่ textarea สูงขึ้น */
      }
      /* Override Tailwind's default dark mode colors for specific elements to match the design */
      .bg-gray-800 {
        background-color: #1a1a2e; /* Darker blue-purple for cards */
      }
      .border-gray-700 {
        border-color: #2c2c4b; /* Slightly lighter border for cards */
      }
      .bg-gray-700 {
        background-color: #27273f; /* Input fields background */
      }
      .border-gray-600 {
        border-color: #3f3f5a; /* Input fields border */
      }
      .text-cyan-400 {
        color: #66fcf1; /* Primary highlight color */
      }
      .text-green-400 {
        color: #66fcf1; /* Match primary highlight for consistent branding */
      }
      .text-yellow-400 {
        color: #ffde59; /* A softer yellow for contrast */
      }
      .bg-cyan-600 {
        background-color: #45a29e; /* Button background */
      }
      .hover\:bg-cyan-700:hover {
        background-color: #388a85; /* Button hover */
      }
      .focus\:ring-cyan-500:focus {
        --tw-ring-color: #66fcf1; /* Focus ring color */
      }
      .focus\:ring-yellow-500:focus {
        --tw-ring-color: #ffde59; /* Focus ring color */
      }
      .bg-gray-900 {
        background-color: #0d0d15; /* Deeper background for textareas */
      }
      .text-gray-400 {
        color: #a0a0b0; /* Subtler text */
      }
      .text-gray-300 {
        color: #e0e0e0; /* Label text */
      }
      .border-red-600 {
        border-color: #ff6b6b; /* Failure border */
      }
      .text-red-500 {
        color: #ff6b6b; /* Failure icon */
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-4xl mx-auto relative z-10">
      <h1 class="text-3xl font-bold text-center text-cyan-400 mb-6">
        โปรแกรมจำลองการ Encoding / Decoding (Base64)
      </h1>
      <p class="text-center text-gray-400 mb-8 max-w-2xl mx-auto">
        ทดลองพิมพ์ข้อความ (รวมถึงภาษาไทย) เพื่อดูว่ากระบวนการ "แปล" ข้อมูลเป็น
        Base64 (และแปลกลับ) ทำงานอย่างไร นี่คือกระบวนการที่ย้อนกลับได้ (Two-way)
      </p>

      <div class="grid md:grid-cols-2 gap-8">
        <!-- 1. กล่อง ENCODE -->
        <div
          class="bg-gray-800 p-6 rounded-lg shadow-2xl border border-gray-700"
        >
          <h2
            class="text-2xl font-semibold mb-5 text-green-400 border-b border-gray-700 pb-2"
          >
            1. กระบวนการ Encode (เข้ารหัส)
          </h2>

          <!-- ช่องป้อนข้อความปกติ -->
          <div class="mb-4">
            <label
              for="plain-text"
              class="block text-sm font-medium text-gray-300 mb-1"
              >ข้อความปกติ (Plain Text):</label
            >
            <textarea
              id="plain-text"
              rows="5"
              class="w-full p-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none"
            >
สวัสดี ประเทศไทย!</textarea
            >
          </div>

          <!-- ปุ่ม Encode -->
          <button
            id="encode-btn"
            class="w-full py-3 px-4 bg-cyan-600 hover:bg-cyan-700 text-white rounded-md font-semibold text-lg mb-4"
          >
            Encode $\downarrow$
          </button>

          <!-- ช่องแสดงผล Base64 -->
          <div>
            <label
              for="base64-output"
              class="block text-sm font-medium text-gray-300 mb-1"
              >ข้อความ Base64:</label
            >
            <textarea
              id="base64-output"
              rows="5"
              class="w-full p-2 bg-gray-900 border border-gray-600 rounded-md text-green-400 text-sm"
              readonly
            ></textarea>
          </div>
        </div>

        <!-- 2. กล่อง DECODE -->
        <div
          class="bg-gray-800 p-6 rounded-lg shadow-2xl border border-gray-700"
        >
          <h2
            class="text-2xl font-semibold mb-5 text-yellow-400 border-b border-gray-700 pb-2"
          >
            2. กระบวนการ Decode (ถอดรหัส)
          </h2>

          <!-- ช่องป้อน Base64 -->
          <div class="mb-4">
            <label
              for="base64-input"
              class="block text-sm font-medium text-gray-300 mb-1"
              >ข้อความ Base64:</label
            >
            <textarea
              id="base64-input"
              rows="5"
              class="w-full p-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:ring-2 focus:ring-yellow-500 focus:outline-none"
            ></textarea>
          </div>

          <!-- ปุ่ม Decode -->
          <button
            id="decode-btn"
            class="w-full py-3 px-4 bg-gray-600 hover:bg-gray-500 text-white rounded-md font-semibold text-lg mb-4"
          >
            $\uparrow$ Decode
          </button>

          <!-- ช่องแสดงผลข้อความปกติ -->
          <div>
            <label
              for="plain-output"
              class="block text-sm font-medium text-gray-300 mb-1"
              >ข้อความปกติ (Plain Text):</label
            >
            <textarea
              id="plain-output"
              rows="5"
              class="w-full p-2 bg-gray-900 border border-gray-600 rounded-md text-yellow-400 text-sm"
              readonly
            ></textarea>
          </div>
        </div>
      </div>

      <!-- กล่องแสดงข้อผิดพลาด -->
      <div
        id="error-box"
        class="hidden flex items-center p-4 mt-6 rounded-md bg-red-900 bg-opacity-50 border border-red-600"
      >
        <svg
          class="w-6 h-6 text-red-500 mr-3 flex-shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
          />
        </svg>
        <span id="error-message" class="text-red-400"></span>
      </div>
    </div>

    <script>
      window.addEventListener("mousemove", (e) => {
        document.documentElement.style.setProperty(
          "--mouse-x",
          `${e.clientX}px`
        );
        document.documentElement.style.setProperty(
          "--mouse-y",
          `${e.clientY}px`
        );
      });

      // องค์ประกอบ DOM
      const plainTextInput = document.getElementById("plain-text");
      const base64Output = document.getElementById("base64-output");
      const encodeBtn = document.getElementById("encode-btn");

      const base64Input = document.getElementById("base64-input");
      const plainOutput = document.getElementById("plain-output");
      const decodeBtn = document.getElementById("decode-btn");

      const errorBox = document.getElementById("error-box");
      const errorMessage = document.getElementById("error-message");

      // TextEncoder/TextDecoder สำหรับจัดการ UTF-8 (ภาษาไทย)
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();

      /**
       * ซ่อนกล่องข้อผิดพลาด
       */
      function hideError() {
        errorBox.classList.add("hidden");
        errorMessage.textContent = "";
      }

      /**
       * แสดงกล่องข้อผิดพลาด
       */
      function showError(message) {
        errorBox.classList.remove("hidden");
        errorMessage.textContent = message;
      }

      /**
       * กระบวนการ Encode
       * แปลง Plain text (UTF-8) -> Bytes -> Base64 string
       */
      function handleEncode() {
        hideError();
        try {
          const text = plainTextInput.value;
          // 1. แปลง string (UTF-8) เป็น Uint8Array (ชุดของ bytes)
          const uint8Array = encoder.encode(text);

          // 2. แปลง bytes เป็น string ที่มีแต่อักขระ 1 byte
          const byteString = String.fromCharCode.apply(null, uint8Array);

          // 3. ใช้ btoa (binary-to-ascii) เพื่อ encode เป็น Base64
          const base64String = btoa(byteString);

          base64Output.value = base64String;
          base64Input.value = base64String; // ส่งต่อไปยังอีกฝั่ง
          plainOutput.value = text; // ส่งต่อไปยังอีกฝั่ง
        } catch (error) {
          console.error("Encode error:", error);
          showError("เกิดข้อผิดพลาดขณะ Encode: " + error.message);
        }
      }

      /**
       * กระบวนการ Decode
       * แปลง Base64 string -> Raw Bytes -> Plain text (UTF-8)
       */
      function handleDecode() {
        hideError();
        try {
          const base64String = base64Input.value;
          if (base64String.trim() === "") {
            plainOutput.value = "";
            plainTextInput.value = "";
            return;
          }

          // 1. ใช้ atob (ascii-to-binary) เพื่อ decode Base64 กลับเป็น raw byte string
          const byteString = atob(base64String);

          // 2. แปลง raw byte string กลับเป็น Uint8Array
          const uint8Array = new Uint8Array(byteString.length);
          for (let i = 0; i < byteString.length; i++) {
            uint8Array[i] = byteString.charCodeAt(i);
          }

          // 3. ใช้ TextDecoder เพื่อแปลชุด bytes (UTF-8) กลับเป็น string
          const text = decoder.decode(uint8Array);

          plainOutput.value = text;
          plainTextInput.value = text; // ส่งต่อไปยังอีกฝั่ง
          base64Output.value = base64String; // ส่งต่อไปยังอีกฝั่ง
        } catch (error) {
          console.error("Decode error:", error);
          // ตรวจจับข้อผิดพลาดที่พบบ่อย
          if (
            error instanceof DOMException &&
            error.name === "InvalidCharacterError"
          ) {
            showError(
              "Decode ผิดพลาด: ข้อมูลที่ป้อนไม่ใช่ Base64 ที่ถูกต้อง (อาจมีอักขระที่ไม่รองรับ)"
            );
          } else if (error instanceof URIError) {
            showError(
              "Decode ผิดพลาด: ข้อมูลที่ป้อนไม่ใช่ UTF-8 ที่ถูกต้อง (อาจเกิดจาก Base64 ที่ไม่สมบูรณ์)"
            );
          } else {
            showError("เกิดข้อผิดพลาดขณะ Decode: " + error.message);
          }
        }
      }

      // --- ตัวดักฟังเหตุการณ์ ---
      encodeBtn.addEventListener("click", handleEncode);
      decodeBtn.addEventListener("click", handleDecode);

      // --- โหลดเริ่มต้น ---
      // ทำการ Encode ค่าเริ่มต้น "สวัสดี ประเทศไทย!" เมื่อโหลดหน้า
      handleEncode();
    </script>
  </body>
</html>
